<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>四向避障跑酷 - 體感互動遊戲</title>
  <!-- 引入 TensorFlow.js 與 TM Pose SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.35rem; color: #38bdf8; }
    .rules-card {
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      line-height: 1.5;
      border-left: 4px solid #38bdf8;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    .game-layout {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 900px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border-radius: 8px;
      background: #020617;
      display: block;
    }
    #gameCanvas { width: 460px; height: 460px; }
    
    .webcam-container {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    #webcamCanvas {
      width: 260px;
      height: 260px;
      transform: scaleX(-1); /* 鏡像翻轉 */
    }

    .hud-box {
      margin-top: 8px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 0.85rem;
      background: #1f2937;
      padding: 8px;
      border-radius: 6px;
    }
    .hud-tag { font-weight: bold; color: #38bdf8; }
    
    .confidence-meter {
      width: 100%;
      background: #334155;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .confidence-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.1s;
    }

    #poseWarn {
      color: #f87171;
      font-size: 0.8rem;
      margin-top: 4px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏃 體感四向跑酷遊戲</h1>
    <button class="btn" id="startBtn" onclick="initSystem()">點擊啟動相機並開始</button>
  </header>

  <!-- 要求 1：遊戲說明 -->
  <div class="rules-card">
    <b>【遊戲操作說明】</b><br>
    • <b>重要提醒</b>：本遊戲是<b>姿勢骨架模型 (Pose)</b>，<b>請坐後一點，確保鏡頭拍得到肩膀、雙手與胸口！</b><br>
    • <b>動作類別</b>：<br>
    &nbsp;&nbsp;1. <b>default (待機)</b>：雙手自然垂下放鬆。<br>
    &nbsp;&nbsp;2. <b>up (上)</b>：手臂舉高過肩膀。<br>
    &nbsp;&nbsp;3. <b>down (下)</b>：雙手收攏並微蹲。<br>
    &nbsp;&nbsp;4. <b>left (左) / right (右)</b>：手臂往左側或右側平舉。<br>
    • <i>(亦支援鍵盤 ↑ ↓ ← → 與 Space 作為備援操作)</i>
  </div>

  <div class="game-layout">
    <!-- 主遊戲畫面 -->
    <div class="card">
      <div class="hud-box">
        <span>分數: <span id="scoreVal" class="hud-tag">0</span></span>
        <span>生命: <span id="hpVal" class="hud-tag">3</span></span>
        <span>提示訊息: <span id="msgVal" class="hud-tag">請點擊上方按鈕開始</span></span>
      </div>
      <canvas id="gameCanvas" width="460" height="460"></canvas>
    </div>

    <!-- 要求 2：攝影機畫面、辨識結果與信心度 -->
    <div class="card" style="width: 284px;">
      <div style="font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8;">攝影機與骨架即時預覽</div>
      <div class="webcam-container">
        <!-- 直接使用單一 Canvas 繪製相機影像與骨架，解決疊層遮蔽與縮放問題 -->
        <canvas id="webcamCanvas" width="260" height="260"></canvas>
      </div>
      <div id="poseWarn"></div>

      <div class="hud-box" style="flex-direction: column; gap: 4px; margin-top: 6px;">
        <div style="display: flex; justify-content: space-between;">
          <span>目前動作: <b id="currentPoseVal" style="color: #f59e0b;">待機中</b></span>
          <span>信心度: <b id="confidenceVal">0%</b></span>
        </div>
        <div class="confidence-meter">
          <div class="confidence-fill" id="confidenceBar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ccGXFMyGc/";

    const gameCanvas = document.getElementById('gameCanvas');
    const ctx = gameCanvas.getContext('2d');
    const webcamCanvas = document.getElementById('webcamCanvas');
    const webcamCtx = webcamCanvas.getContext('2d');
    const poseWarn = document.getElementById('poseWarn');

    const CENTER_X = 230;
    const CENTER_Y = 230;
    const TRACK_DIST = 120;

    const LANES = {
      default: { x: CENTER_X, y: CENTER_Y },
      up:      { x: CENTER_X, y: CENTER_Y - TRACK_DIST },
      down:    { x: CENTER_X, y: CENTER_Y + TRACK_DIST },
      left:    { x: CENTER_X - TRACK_DIST, y: CENTER_Y },
      right:   { x: CENTER_X + TRACK_DIST, y: CENTER_Y }
    };

    let player = {
      x: CENTER_X,
      y: CENTER_Y,
      targetX: CENTER_X,
      targetY: CENTER_Y,
      radius: 18,
      invulnerable: 0
    };

    let obstacles = [];
    let score = 0;
    let hp = 3;
    let isRunning = false;
    let spawnTimer = 0;
    let currentLaneName = 'default';
    let trackGlowColor = '#1e293b';

    // 音效合成器 (要求 3)
    let audioCtx = null;
    function playBeep(freq = 440, duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 系統初始化
    let model = null;
    let webcam = null;

    async function initSystem() {
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.innerText = "載入模型中...";
      document.getElementById('msgVal').innerText = "下載姿勢模型中...";

      try {
        // 1. 載入模型
        model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

        // 2. 使用 Teachable Machine 官方封裝的標準 Webcam (寬高 260x260, 鏡像開啟)
        btn.innerText = "啟動鏡頭中...";
        const size = 260;
        const flip = true; 
        webcam = new tmPose.Webcam(size, size, flip);
        await webcam.setup();
        await webcam.play();

        btn.innerText = "重新開始遊戲";
        btn.disabled = false;
        document.getElementById('msgVal').innerText = "遊戲進行中";

        resetGame();
        window.requestAnimationFrame(predictLoop);
        window.requestAnimationFrame(gameLoop);
      } catch (err) {
        console.error("啟動失敗：", err);
        btn.disabled = false;
        btn.innerText = "重試啟動";
        alert("啟動失敗！請確認瀏覽器已允許攝影機權限。");
      }
    }

    // 動作平滑處理
    const WINDOW_SIZE = 5;
    let poseWindow = [];

    function processPrediction(prediction) {
      const sorted = [...prediction].sort((a, b) => b.probability - a.probability);
      const top1 = sorted[0];
      const top2 = sorted[1];

      let rawPose = top1.className.toLowerCase();
      const prob = top1.probability;

      // 競態壓制（right 與 down）
      if (top1.className === 'right' && top2.className === 'down') {
        if (top1.probability - top2.probability < 0.18) {
          rawPose = 'default';
        }
      }

      const threshold = (rawPose === 'right') ? 0.60 : 0.72;
      if (prob < threshold) rawPose = 'default';

      // 信心度更新 (要求 2)
      const percent = Math.round(prob * 100);
      document.getElementById('currentPoseVal').innerText = top1.className;
      document.getElementById('confidenceVal').innerText = `${percent}%`;
      document.getElementById('confidenceBar').style.width = `${percent}%`;

      poseWindow.push(rawPose);
      if (poseWindow.length > WINDOW_SIZE) poseWindow.shift();

      const counts = {};
      poseWindow.forEach(p => counts[p] = (counts[p] || 0) + 1);

      let majority = 'default';
      for (const [p, count] of Object.entries(counts)) {
        if (count >= 3) { majority = p; break; }
      }

      if (majority !== currentLaneName) {
        changeLane(majority);
      }
    }

    function changeLane(lane) {
      currentLaneName = lane;
      if (LANES[lane]) {
        player.targetX = LANES[lane].x;
        player.targetY = LANES[lane].y;
      }

      if (lane !== 'default') {
        trackGlowColor = '#38bdf8';
        document.getElementById('msgVal').innerText = `跑道: ${lane.toUpperCase()}`;
        playBeep(520, 0.08);
      } else {
        trackGlowColor = '#1e293b';
        document.getElementById('msgVal').innerText = '原點待機';
      }
    }

    // 官方標準推論迴圈
    async function predictLoop() {
      if (webcam && model) {
        webcam.update();

        // 1. 將攝影機畫面繪製至 Canvas
        webcamCtx.drawImage(webcam.canvas, 0, 0);

        // 2. 估算骨架
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        const prediction = await model.predict(posenetOutput);

        // 3. 繪製骨架節點
        if (pose) {
          const minPartConfidence = 0.4;
          tmPose.drawKeypoints(pose.keypoints, minPartConfidence, webcamCtx);
          tmPose.drawSkeleton(pose.keypoints, minPartConfidence, webcamCtx);

          // 檢查是否拍到足夠的身體部位
          const shoulders = pose.keypoints.filter(k => k.part.includes('shoulder') && k.score > 0.3);
          if (shoulders.length === 0) {
            poseWarn.innerText = "⚠️ 請坐遠一點，確保鏡頭拍得到肩膀！";
          } else {
            poseWarn.innerText = "";
          }
        } else {
          poseWarn.innerText = "⚠️ 未偵測到人體骨架";
        }

        // 4. 處理判定
        processPrediction(prediction);
      }
      window.requestAnimationFrame(predictLoop);
    }

    // 鍵盤備援
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') changeLane('up');
      if (e.key === 'ArrowDown') changeLane('down');
      if (e.key === 'ArrowLeft') changeLane('left');
      if (e.key === 'ArrowRight') changeLane('right');
      if (e.key === ' ') changeLane('default');
    });

    // 遊戲重設
    function resetGame() {
      score = 0;
      hp = 3;
      obstacles = [];
      isRunning = true;
      spawnTimer = 0;
      player.invulnerable = 60;
      player.x = CENTER_X;
      player.y = CENTER_Y;
      player.targetX = CENTER_X;
      player.targetY = CENTER_Y;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('hpVal').innerText = hp;
      changeLane('default');
    }

    function spawnObstacle() {
      const rand = Math.random();
      let dir = 'up';
      if (rand < 0.29) dir = 'up';
      else if (rand < 0.58) dir = 'down';
      else if (rand < 0.88) dir = 'left';
      else dir = 'right';

      const speed = 1.5 + Math.min(score * 0.04, 1.8);
      let obs = { dir, x: 0, y: 0, vx: 0, vy: 0, r: 15 };

      if (dir === 'up')    { obs.x = CENTER_X; obs.y = -25; obs.vy = speed; }
      if (dir === 'down')  { obs.x = CENTER_X; obs.y = 485; obs.vy = -speed; }
      if (dir === 'left')  { obs.x = -25; obs.y = CENTER_Y; obs.vx = speed; }
      if (dir === 'right') { obs.x = 485; obs.y = CENTER_Y; obs.vx = -speed; }

      obstacles.push(obs);
    }

    function gameLoop() {
      if (!isRunning) return;

      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

      drawTracks();

      player.x += (player.targetX - player.x) * 0.2;
      player.y += (player.targetY - player.y) * 0.2;

      if (player.invulnerable > 0) player.invulnerable--;

      if (player.invulnerable === 0 || Math.floor(player.invulnerable / 6) % 2 === 0) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.invulnerable > 0 ? '#f59e0b' : '#38bdf8';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#e0f2fe';
        ctx.stroke();
      }

      spawnTimer++;
      if (spawnTimer > Math.max(100, 160 - score * 3)) {
        spawnObstacle();
        spawnTimer = 0;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x += obs.vx;
        obs.y += obs.vy;

        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();

        const dist = Math.hypot(player.x - obs.x, player.y - obs.y);
        if (dist < player.radius + obs.r) {
          if (player.invulnerable === 0) {
            hp--;
            document.getElementById('hpVal').innerText = hp;
            player.invulnerable = 60;
            playBeep(200, 0.2);
            obstacles.splice(i, 1);
            if (hp <= 0) {
              gameOver();
              return;
            }
          }
          continue;
        }

        const passed = (obs.dir === 'up' && obs.y > CENTER_Y) ||
                       (obs.dir === 'down' && obs.y < CENTER_Y) ||
                       (obs.dir === 'left' && obs.x > CENTER_X) ||
                       (obs.dir === 'right' && obs.x < CENTER_X);

        if (passed) {
          score++;
          document.getElementById('scoreVal').innerText = score;
          playBeep(880, 0.05);
          obstacles.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    function drawTracks() {
      ctx.strokeStyle = trackGlowColor;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(CENTER_X, 80); ctx.lineTo(CENTER_X, 380);
      ctx.moveTo(80, CENTER_Y); ctx.lineTo(380, CENTER_Y);
      ctx.stroke();

      Object.values(LANES).forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#475569';
        ctx.fill();
      });
    }

    function gameOver() {
      isRunning = false;
      ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
      ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', CENTER_X, CENTER_Y - 10);
      ctx.fillStyle = '#f8fafc';
      ctx.font = '18px sans-serif';
      ctx.fillText(`最終分數: ${score}`, CENTER_X, CENTER_Y + 30);
      document.getElementById('msgVal').innerText = '挑戰結束';
    }

    // 初始清空畫布
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
    drawTracks();
  </script>
</body>
</html>
