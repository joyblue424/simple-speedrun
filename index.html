<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>體感 3D 跑酷 - 清晰動作指示版</title>
  <!-- 引入最新版 TensorFlow.js 與 Teachable Machine Image SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.35rem; color: #38bdf8; }
    .status-bar {
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 8px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #0369a1; }
    .btn:disabled { background: #475569; cursor: not-allowed; }

    .game-layout {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 900px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border-radius: 8px;
      background: #020617;
      display: block;
    }
    #gameCanvas { width: 480px; height: 520px; }
    
    .webcam-container {
      width: 260px;
      height: 260px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }
    #webcamCanvas {
      width: 260px;
      height: 260px;
    }

    .hud-box {
      margin-top: 8px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 0.85rem;
      background: #1f2937;
      padding: 8px;
      border-radius: 6px;
    }
    .hud-tag { font-weight: bold; color: #38bdf8; }
    
    .confidence-meter {
      width: 100%;
      background: #334155;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .confidence-fill {
      height: 100%;
      width: 0%;
      background: #10b981;
      transition: width 0.05s;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏃 體感 3D 跑酷 (視覺清晰升級版)</h1>
    <button class="btn" id="startBtn" onclick="initSystem()">啟動相機並開始遊戲</button>
  </header>

  <div class="status-bar">
    <span>模型：<b style="color: #10b981;">ShkEL2fta (Image 模型已綁定)</b></span>
    <span>系統狀態：<span id="sysStatus" class="hud-tag">點擊按鈕開始</span></span>
  </div>

  <div class="game-layout">
    <!-- 主遊戲畫面 -->
    <div class="card">
      <div class="hud-box">
        <span>得分: <span id="scoreVal" class="hud-tag">0</span></span>
        <span>生命: <span id="hpVal" class="hud-tag">3</span></span>
        <span>小人動作: <span id="actionVal" class="hud-tag">正常跑步</span></span>
      </div>
      <canvas id="gameCanvas" width="480" height="520"></canvas>
    </div>

    <!-- 即時攝影機畫面與辨識數據 -->
    <div class="card" style="width: 284px;">
      <div style="font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8;">即時攝影機視訊（自拍鏡像）</div>
      <div class="webcam-container">
        <canvas id="webcamCanvas" width="260" height="260"></canvas>
      </div>

      <div class="hud-box" style="flex-direction: column; gap: 4px; margin-top: 10px;">
        <div style="display: flex; justify-content: space-between;">
          <span>辨識手勢: <b id="currentPoseVal" style="color: #f59e0b;">待機中</b></span>
          <span>信心度: <b id="confidenceVal">0%</b></span>
        </div>
        <div class="confidence-meter">
          <div class="confidence-fill" id="confidenceBar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FIXED_MODEL_URL = "https://teachablemachine.withgoogle.com/models/ShkEL2fta/";

    const gameCanvas = document.getElementById('gameCanvas');
    const ctx = gameCanvas.getContext('2d');
    const webcamCanvas = document.getElementById('webcamCanvas');
    const webcamCtx = webcamCanvas.getContext('2d');
    const sysStatus = document.getElementById('sysStatus');

    // --- 音效模組 ---
    let audioCtx = null;
    function playBeep(freq = 440, duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // --- 跑道與跑者數據 ---
    const LANES_X = [140, 240, 340];
    
    let runner = {
      lane: 1,         // 0: 左, 1: 中, 2: 右
      currentX: 240,
      y: 440,
      jumpOffset: 0,
      isJumping: false,
      isSliding: false,
      runAnim: 0,
      invulnerable: 0
    };

    let obstacles = [];
    let score = 0;
    let hp = 3;
    let isRunning = false;
    let spawnTimer = 0;
    let groundScroll = 0;
    let lastAppliedPose = '';
    let currentAlertText = '';

    // 即時套用手勢動作
    function applyPoseImmediate(pose) {
      const p = pose.toLowerCase().trim();

      let actionText = "正常跑步";
      if (p === 'up') actionText = "⬆️ 跳躍中！";
      else if (p === 'down') actionText = "⬇️ 蹲下滑行！";
      else if (p === 'left') actionText = "⬅️ 切換左跑道";
      else if (p === 'right') actionText = "➡️ 切換右跑道";
      document.getElementById('actionVal').innerText = actionText;

      if (p === lastAppliedPose) return;
      lastAppliedPose = p;

      switch(p) {
        case 'up':
          runner.isJumping = true;
          runner.isSliding = false;
          playBeep(620, 0.08);
          break;
        case 'down':
          runner.isSliding = true;
          runner.isJumping = false;
          playBeep(330, 0.08);
          break;
        case 'left':
          runner.lane = 0;
          runner.isSliding = false;
          playBeep(480, 0.06);
          break;
        case 'right':
          runner.lane = 2;
          runner.isSliding = false;
          playBeep(480, 0.06);
          break;
        case 'default':
        default:
          runner.lane = 1;
          runner.isSliding = false;
          break;
      }
    }

    // 鍵盤備援
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') applyPoseImmediate('up');
      if (e.key === 'ArrowDown') applyPoseImmediate('down');
      if (e.key === 'ArrowLeft') applyPoseImmediate('left');
      if (e.key === 'ArrowRight') applyPoseImmediate('right');
      if (e.key === ' ') applyPoseImmediate('default');
    });

    // --- tmImage 圖像模型初始化 ---
    let model = null;
    let webcam = null;

    async function initSystem() {
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      sysStatus.innerText = "正在載入模型...";

      try {
        const modelURL = FIXED_MODEL_URL + "model.json";
        const metadataURL = FIXED_MODEL_URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        sysStatus.innerText = "模型載入成功，啟動鏡頭...";

        // flip = true 為標準自拍鏡像
        const size = 260;
        const flip = true; 
        webcam = new tmImage.Webcam(size, size, flip);
        await webcam.setup();
        await webcam.play();

        sysStatus.innerText = "遊戲進行中";
        btn.innerText = "重新開始遊戲";
        btn.disabled = false;

        resetGame();
        requestAnimationFrame(predictLoop);
        requestAnimationFrame(gameLoop);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        sysStatus.innerText = "載入失敗";
        alert("相機啟動或模型載入失敗，請確認已允許攝影機權限！");
      }
    }

    async function predictLoop() {
      if (webcam && model) {
        webcam.update();
        webcamCtx.drawImage(webcam.canvas, 0, 0);

        try {
          const prediction = await model.predict(webcam.canvas);

          const sorted = [...prediction].sort((a, b) => b.probability - a.probability);
          const top = sorted[0];

          const percent = Math.round(top.probability * 100);
          document.getElementById('currentPoseVal').innerText = top.className;
          document.getElementById('confidenceVal').innerText = `${percent}%`;
          document.getElementById('confidenceBar').style.width = `${percent}%`;

          // 信心度門檻即時驅動
          if (top.probability > 0.58) {
            applyPoseImmediate(top.className);
          }
        } catch (e) {}
      }
      requestAnimationFrame(predictLoop);
    }

    // --- 遊戲邏輯 ---
    function resetGame() {
      score = 0;
      hp = 3;
      obstacles = [];
      isRunning = true;
      spawnTimer = 0;
      runner.lane = 1;
      runner.currentX = LANES_X[1];
      runner.isJumping = false;
      runner.isSliding = false;
      runner.jumpOffset = 0;
      runner.invulnerable = 60;
      lastAppliedPose = '';
      currentAlertText = '';
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('hpVal').innerText = hp;
      document.getElementById('actionVal').innerText = "正常跑步";
    }

    function spawnObstacle() {
      // hurdle: 跳欄(跳躍) | banner: 懸掛路標(蹲下) | crate: 施工木箱(切換跑道閃避)
      const types = ['hurdle', 'banner', 'crate'];
      const type = types[Math.floor(Math.random() * types.length)];
      const lane = Math.floor(Math.random() * 3);

      obstacles.push({
        lane: lane,
        type: type,
        z: 0
      });
    }

    function gameLoop() {
      if (!isRunning) return;

      drawTrack();

      // 小人切換跑道插值平滑
      runner.currentX += (LANES_X[runner.lane] - runner.currentX) * 0.25;

      // 跳躍平滑動畫
      if (runner.isJumping) {
        runner.jumpOffset += 4;
        if (runner.jumpOffset > 55) {
          runner.isJumping = false;
        }
      } else if (runner.jumpOffset > 0) {
        runner.jumpOffset -= 4;
        if (runner.jumpOffset < 0) runner.jumpOffset = 0;
      }

      // 生成障礙物 (適當間距，確保有反應時間)
      spawnTimer++;
      if (spawnTimer > Math.max(80, 130 - score * 2)) {
        spawnObstacle();
        spawnTimer = 0;
      }

      // 找出離玩家最近的前方障礙物，觸發頂部即時警報提示
      let closestObstacle = null;
      let minDistance = 999;

      for (let i = 0; i < obstacles.length; i++) {
        if (obstacles[i].z > 0.35 && obstacles[i].z < 0.88) {
          if (obstacles[i].z < minDistance) {
            closestObstacle = obstacles[i];
            minDistance = obstacles[i].z;
          }
        }
      }

      if (closestObstacle) {
        if (closestObstacle.type === 'hurdle') {
          currentAlertText = "⚡ 前方跳欄 ➔ 請比【UP 向上】跳躍！";
        } else if (closestObstacle.type === 'banner') {
          currentAlertText = "⚡ 前方高架牌 ➔ 請比【DOWN 向下】蹲下滑行！";
        } else if (closestObstacle.type === 'crate') {
          currentAlertText = "⚡ 前方路障 ➔ 請比【LEFT / RIGHT】避開！";
        }
      } else {
        currentAlertText = "";
      }

      // 更新障礙物移動與繪製
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.z += 0.011 + Math.min(score * 0.0004, 0.012);

        drawClearObstacle(obs);

        // 碰撞檢測區間 (接近玩家 z: 0.85 ~ 0.98)
        if (obs.z >= 0.85 && obs.z <= 0.98) {
          let hit = false;

          if (obs.type === 'crate') {
            // 單道木箱：同跑道則撞擊
            if (runner.lane === obs.lane) hit = true;
          } else if (obs.type === 'hurdle') {
            // 跳欄：同跑道且沒有跳躍則撞擊
            if (runner.lane === obs.lane && runner.jumpOffset < 28) hit = true;
          } else if (obs.type === 'banner') {
            // 橫額牌：同跑道且沒有蹲下滑行則撞擊
            if (runner.lane === obs.lane && !runner.isSliding) hit = true;
          }

          if (hit && runner.invulnerable === 0) {
            hp--;
            runner.invulnerable = 60;
            playBeep(200, 0.2);
            document.getElementById('hpVal').innerText = hp;
            obstacles.splice(i, 1);
            if (hp <= 0) {
              handleGameOver();
              return;
            }
            continue;
          }
        }

        // 超越玩家加分
        if (obs.z > 1.05) {
          score++;
          document.getElementById('scoreVal').innerText = score;
          playBeep(880, 0.04);
          obstacles.splice(i, 1);
        }
      }

      // 繪製奔跑小人
      drawRunner();

      // 繪製頂部動態動作警報提示
      drawAlertBanner();

      if (runner.invulnerable > 0) runner.invulnerable--;
      requestAnimationFrame(gameLoop);
    }

    // --- 繪製跑道與背景 ---
    function drawTrack() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

      const horizonY = 160;

      // 跑道底板
      ctx.beginPath();
      ctx.moveTo(180, horizonY);
      ctx.lineTo(300, horizonY);
      ctx.lineTo(440, 520);
      ctx.lineTo(40, 520);
      ctx.fillStyle = '#1e293b';
      ctx.fill();

      // 跑道亮藍邊緣線
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(180, horizonY); ctx.lineTo(40, 520);
      ctx.moveTo(300, horizonY); ctx.lineTo(440, 520);
      ctx.stroke();

      // 跑道分道白虛線
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.setLineDash([16, 16]);
      ctx.beginPath();
      ctx.moveTo(220, horizonY); ctx.lineTo(173, 520);
      ctx.moveTo(260, horizonY); ctx.lineTo(307, 520);
      ctx.stroke();
      ctx.setLineDash([]);

      // 速度滾動橫線
      groundScroll = (groundScroll + 4.5) % 40;
      for (let y = horizonY + groundScroll; y < 520; y += 40) {
        const factor = (y - horizonY) / (520 - horizonY);
        const leftX = 180 - (180 - 40) * factor;
        const rightX = 300 + (440 - 300) * factor;
        ctx.strokeStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(leftX, y);
        ctx.lineTo(rightX, y);
        ctx.stroke();
      }
    }

    // --- 繪製小人 (帶跳躍影子與跑步擺動) ---
    function drawRunner() {
      const x = runner.currentX;
      const groundY = runner.y;
      const y = groundY - runner.jumpOffset;

      // 繪製地面的陰影（跳得越高影子越小越淡）
      const shadowScale = Math.max(0.4, 1 - runner.jumpOffset / 80);
      ctx.save();
      ctx.translate(x, groundY + 12);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 16 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (runner.invulnerable > 0 && Math.floor(runner.invulnerable / 5) % 2 === 0) {
        return; // 無敵閃爍
      }

      runner.runAnim += 0.22;
      const legSwing = Math.sin(runner.runAnim) * 12;

      ctx.save();
      ctx.translate(x, y);

      if (runner.isSliding) {
        // 蹲下滑行姿態 (扁平藍色膠囊體 + 低伏頭部)
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.ellipse(0, 8, 22, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(14, 4, 7, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 正常奔跑姿態
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(0, -32, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(0, -5);
        ctx.stroke();

        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-12, -18);
        ctx.lineTo(0, -20);
        ctx.lineTo(12, -18);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.lineTo(-8, 15 + legSwing);
        ctx.moveTo(0, -5);
        ctx.lineTo(8, 15 - legSwing);
        ctx.stroke();
      }

      ctx.restore();
    }

    // --- 繪製清晰、易辨識的單道障礙物與氣泡提示 ---
    function drawClearObstacle(obs) {
      const horizonY = 160;
      const z = obs.z;
      const y = horizonY + (520 - horizonY) * z;
      
      const factor = (y - horizonY) / (520 - horizonY);
      const laneWidth = (300 - 180 + (440 - 40 - (300 - 180)) * factor) / 3;
      const leftBoundary = 180 - (180 - 40) * factor;
      const x = leftBoundary + laneWidth * obs.lane + laneWidth / 2;
      const scale = 0.35 + z * 0.85;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      if (obs.type === 'crate') {
        // 1. 單軌木質路障（避開 LEFT / RIGHT）
        ctx.fillStyle = '#b45309';
        ctx.fillRect(-22, -32, 44, 32);
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 3;
        ctx.strokeRect(-22, -32, 44, 32);

        // 木箱對角線
        ctx.beginPath();
        ctx.moveTo(-22, -32); ctx.lineTo(22, 0);
        ctx.moveTo(22, -32); ctx.lineTo(-22, 0);
        ctx.stroke();

        // 標籤氣泡
        drawPromptBadge(0, -52, "⚠️ 換道閃避", "#ef4444");

      } else if (obs.type === 'hurdle') {
        // 2. 田徑跳欄（比 UP 跳躍）- 清晰白橘相間條紋，無滿版紅刺
        // 兩側立腳
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-24, 0); ctx.lineTo(-24, -22);
        ctx.moveTo(24, 0); ctx.lineTo(24, -22);
        ctx.stroke();

        // 橫桿
        ctx.fillStyle = '#f97316';
        ctx.fillRect(-26, -24, 52, 9);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-10, -24, 20, 9);

        // 標籤氣泡
        drawPromptBadge(0, -48, "⬆️ 跳躍 (UP)", "#f59e0b");

      } else if (obs.type === 'banner') {
        // 3. 高空門牌橫額（比 DOWN 蹲下）- 底下完全淨空，清楚表示可從下方穿過
        // 兩側金屬高立柱
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-26, 0); ctx.lineTo(-26, -58);
        ctx.moveTo(26, 0); ctx.lineTo(26, -58);
        ctx.stroke();

        // 頂部橫牌
        ctx.fillStyle = '#0369a1';
        ctx.fillRect(-28, -58, 56, 18);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(-28, -58, 56, 18);

        // 橫牌文字
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("LOW LIMIT", 0, -46);

        // 標籤氣泡
        drawPromptBadge(0, -78, "⬇️ 蹲下 (DOWN)", "#10b981");
      }

      ctx.restore();
    }

    // 障礙物上方懸浮指引氣泡
    function drawPromptBadge(bx, by, text, bgColor) {
      ctx.save();
      ctx.font = 'bold 12px sans-serif';
      const textWidth = ctx.measureText(text).width;
      const pad = 8;
      
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(bx - textWidth / 2 - pad, by - 10, textWidth + pad * 2, 20, 5);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, bx, by);
      ctx.restore();
    }

    // 畫面頂端即時動態提示條
    function drawAlertBanner() {
      if (!currentAlertText) return;

      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.beginPath();
      ctx.roundRect(20, 20, 440, 38, 8);
      ctx.fill();

      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(currentAlertText, 240, 39);
      ctx.restore();
    }

    function handleGameOver() {
      isRunning = false;
      ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
      ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', 240, 230);
      ctx.fillStyle = '#f8fafc';
      ctx.font = '18px sans-serif';
      ctx.fillText(`最終得分: ${score}`, 240, 275);
      document.getElementById('actionVal').innerText = "撞毀停止";
    }

    drawTrack();
  </script>
</body>
</html>
